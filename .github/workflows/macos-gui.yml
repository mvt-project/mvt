name: macOS GUI
on:
  push:
    paths:
      - "macos/**"
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/macos-gui.yml"
  pull_request:
    paths:
      - "macos/**"
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/macos-gui.yml"
  workflow_dispatch:
  # Also run by sync-upstream.yml against a merge before it lands.
  workflow_call:
    inputs:
      ref:
        description: Commit to check out (defaults to the commit that triggered the run)
        type: string
        default: ""

permissions:
  contents: read

jobs:
  cli-contract:
    name: CLI matches GUI expectations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0 # setuptools-scm derives the version from git history
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install MVT from this checkout
        run: pip install .
      - name: Check CLI contract
        run: python macos/scripts/check_cli_contract.py

  build:
    name: Build macOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: Build
        run: |
          xcodebuild -version
          xcodebuild \
            -project macos/MVTGUI.xcodeproj \
            -scheme MVTGUI \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY=- \
            build
      - name: Package
        run: |
          ditto -c -k --keepParent build/DerivedData/Build/Products/Release/MVTGUI.app MVTGUI.zip
      - uses: actions/upload-artifact@v7
        with:
          name: MVTGUI
          path: MVTGUI.zip
