name: Screenshots
# Builds the app, opens each main screen with real data (the latest MVT from
# PyPI, downloaded indicators, and results from the test backup) and
# commits the captures to macos/screenshots/, which the README shows.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: |
          xcodebuild -project macos/MVTGUI.xcodeproj -scheme MVTGUI -configuration Release \
            -derivedDataPath build/DerivedData CODE_SIGN_IDENTITY=- build -quiet

      - name: Install MVT and prepare data
        run: |
          command -v pipx > /dev/null || brew install pipx
          pipx install mvt
          export PATH="$HOME/.local/bin:$PATH"
          mvt-ios --disable-update-check download-iocs
          # Outside ~/Documents and ~/Desktop, so macOS asks no permission.
          mkdir -p "$HOME/MVT"
          cp -R tests/artifacts/ios_backup "$HOME/MVT/iPhone Backup"
          mvt-ios --disable-update-check --disable-indicator-update-check check-backup \
            --iocs tests/artifacts/stix2/cytrox.stix2 --output "$HOME/MVT/Results" "$HOME/MVT/iPhone Backup"
          python3 -m pip install --quiet --break-system-packages pyobjc-framework-Quartz

      - name: Capture screens
        run: |
          app="$PWD/build/DerivedData/Build/Products/Release/MVTGUI.app"
          out="$PWD/macos/screenshots"
          mkdir -p "$out"
          cat > "$RUNNER_TEMP/window.py" <<'PY'
          import sys
          import Quartz
          pid = int(sys.argv[1])
          windows = Quartz.CGWindowListCopyWindowInfo(Quartz.kCGWindowListOptionAll, Quartz.kCGNullWindowID)
          ours = [w for w in windows if w.get("kCGWindowOwnerPID") == pid and w.get("kCGWindowLayer") == 0
                  and w.get("kCGWindowBounds", {}).get("Height", 0) > 200]
          for w in ours:
              print(w["kCGWindowNumber"], w.get("kCGWindowOwnerName"), dict(w.get("kCGWindowBounds", {})), file=sys.stderr)
          print(ours[0]["kCGWindowNumber"] if ours else "")
          PY
          capture() {
            name=$1; shift
            open -n "$app" --args "$@"
            sleep 20
            osascript -e 'tell application "MVTGUI" to activate' || true
            sleep 2
            id=$(python3 "$RUNNER_TEMP/window.py" "$(pgrep -nx MVTGUI || echo 0)")
            echo "$name: window ${id:-not found}"
            if [ -n "$id" ]; then
              screencapture -x -o -l"$id" "$out/$name.png"
            else
              screencapture -x "$out/$name.png"
              touch "$RUNNER_TEMP/fallback"
            fi
            sips -Z 1600 "$out/$name.png" > /dev/null
            pkill -x MVTGUI || true
            sleep 2
          }
          capture setup -startScreen setup
          capture indicators -startScreen indicators
          capture check-backup -startScreen iosCheckBackup \
            -inputPath "$HOME/MVT/iPhone Backup" -outputPath "$HOME/MVT/Results"
          capture check-androidqf -startScreen androidCheckAndroidQF
          capture results -startScreen results -resultsFolder "$HOME/MVT/Results"
          ls -la "$out"

      - uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: macos/screenshots

      - name: Commit screenshots
        run: |
          if [ -e "$RUNNER_TEMP/fallback" ]; then
            echo "::warning::Some windows weren't found; see the artifact. Not committing."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add macos/screenshots
          git diff --cached --quiet && exit 0
          git commit -m "Update app screenshots"
          git push origin "HEAD:${GITHUB_REF_NAME}"
