name: Sync upstream
# Keeps this fork current with mvt-project/mvt.
#
# Once a day, new commits on upstream's main branch are merged into this
# fork's default branch, but only after the merged code has passed upstream's
# test suite, the macOS app build and the GUI's CLI contract check
# (macos/scripts/check_cli_contract.py). If the merge conflicts with this
# fork's changes, or a check fails, the default branch is left alone and the
# run fails, so GitHub emails you. The merge result stays on the
# sync/upstream branch, and a pull request or issue is opened when the
# repository allows it. Commits pushed to sync/upstream (for example to adapt
# the app to an upstream change) are kept by later runs.
#
# Upstream sometimes changes files in .github/workflows/, which the built-in
# GITHUB_TOKEN may not push; such syncs stop with instructions. To let them
# through automatically too, add a repository secret named SYNC_TOKEN: a
# fine-grained personal access token for this repository with Contents,
# Workflows and Pull requests set to read and write.
#
# Run it by hand from the Actions tab. "Dry run" merges and runs every check
# without updating the default branch. Naming another upstream branch
# test-merges that branch instead, always as a dry run.

on:
  schedule:
    - cron: "23 5 * * *" # daily, 05:23 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: Merge and run the checks without updating the default branch
        type: boolean
        default: false
      upstream_branch:
        description: Upstream branch to merge (anything but main is always a dry run)
        type: string
        default: main

permissions: {}

concurrency:
  group: sync-upstream

env:
  UPSTREAM_REPO: mvt-project/mvt
  UPSTREAM_BRANCH: ${{ inputs.upstream_branch || 'main' }}
  BASE_BRANCH: ${{ github.event.repository.default_branch || github.ref_name }}
  BOT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com

jobs:
  merge:
    name: Merge upstream
    if: github.repository != 'mvt-project/mvt'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      behind: ${{ steps.fetch.outputs.behind }}
      dry_run: ${{ steps.mode.outputs.dry_run }}
      sync_branch: ${{ steps.mode.outputs.sync_branch }}
      sha: ${{ steps.push.outputs.sha }}
      problem: ${{ steps.merge.outputs.problem || steps.push.outputs.problem }}
    steps:
      - name: Choose mode
        id: mode
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ] || [ "$UPSTREAM_BRANCH" != "main" ]; then
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
            echo "sync_branch=sync/dry-run" >> "$GITHUB_OUTPUT"
          else
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
            echo "sync_branch=sync/upstream" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BASE_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Fetch upstream
        id: fetch
        run: |
          git check-ref-format --branch "$UPSTREAM_BRANCH" > /dev/null
          git fetch --no-tags "https://github.com/${UPSTREAM_REPO}.git" \
            "+refs/heads/${UPSTREAM_BRANCH}:refs/remotes/upstream/${UPSTREAM_BRANCH}"
          behind=$(git rev-list --count "HEAD..upstream/${UPSTREAM_BRANCH}")
          echo "behind=${behind}" >> "$GITHUB_OUTPUT"
          echo "::notice::${BASE_BRANCH} is ${behind} commit(s) behind ${UPSTREAM_REPO}@${UPSTREAM_BRANCH}"

      - name: Merge
        id: merge
        if: steps.fetch.outputs.behind != '0'
        env:
          BEHIND: ${{ steps.fetch.outputs.behind }}
          SYNC_BRANCH: ${{ steps.mode.outputs.sync_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "$BOT_EMAIL"
          upstream="upstream/${UPSTREAM_BRANCH}"
          upstream_sha=$(git rev-parse --short "$upstream")
          base=$(git rev-parse HEAD)
          report="$RUNNER_TEMP/report"
          mkdir -p "$report"

          # Keep commits someone pushed to an existing sync branch instead of
          # overwriting them.
          start=$base
          if git fetch --no-tags origin "+refs/heads/${SYNC_BRANCH}:refs/remotes/origin/${SYNC_BRANCH}" 2> /dev/null \
             && git log --format='%ae' "origin/${SYNC_BRANCH}" --not "$base" "$upstream" | grep -qvxF "$BOT_EMAIL"; then
            start=$(git rev-parse "origin/${SYNC_BRANCH}")
            echo "::notice::Keeping the commits already pushed to ${SYNC_BRANCH}"
          fi
          git checkout -B "$SYNC_BRANCH" "$start"

          # shellcheck disable=SC2016 # the backticks are Markdown
          {
            echo "Merges **${BEHIND}** commit(s) from [${UPSTREAM_REPO}](https://github.com/${UPSTREAM_REPO}) \`${UPSTREAM_BRANCH}\` (up to \`${upstream_sha}\`) into \`${BASE_BRANCH}\`."
            echo
            gui_files=$(git diff --name-only "${base}...${upstream}" -- \
              src/mvt/ios/cli.py src/mvt/android/cli.py src/mvt/cli.py \
              src/mvt/common/log.py src/mvt/common/alerts.py src/mvt/common/command.py \
              src/mvt/common/config.py src/mvt/common/options.py src/mvt/common/help.py)
            if [ -n "$gui_files" ]; then
              echo "### Changes to files the macOS GUI depends on"
              echo "The CLI contract check covers these. Consider whether new options should be offered in the app."
              echo "$gui_files" | sed 's/^/- `/; s/$/`/'
              echo
            fi
            new_workflows=$(git diff --name-only --diff-filter=A "${base}...${upstream}" -- .github/workflows)
            if [ -n "$new_workflows" ]; then
              echo "### New upstream workflows"
              echo "These will run in this fork too. Disable any that only make sense upstream from the Actions tab, and add them to fork-setup.yml."
              echo "$new_workflows" | sed 's/^/- `/; s/$/`/'
              echo
            fi
            echo "### Upstream commits"
            git log --no-merges --format='- %s (%h)' "${base}..${upstream}" | head -n 60
          } > "$report/summary.md"
          cat "$report/summary.md" >> "$GITHUB_STEP_SUMMARY"

          try_merge() {
            if git merge --no-ff --no-edit "$@"; then
              return 0
            fi
            git diff --name-only --diff-filter=U > "$report/conflicts.txt"
            git merge --abort
            echo "problem=conflict" >> "$GITHUB_OUTPUT"
            return 1
          }
          if [ "$start" != "$base" ]; then
            try_merge "$base" -m "Merge ${BASE_BRANCH} into ${SYNC_BRANCH}" || exit 0
          fi
          try_merge "$upstream" \
            -m "Merge ${UPSTREAM_REPO}@${upstream_sha} into ${BASE_BRANCH}" \
            -m "$(git log --no-merges --format='- %s (%h)' "HEAD..${upstream}" | head -n 60)" \
            || exit 0

      - name: Push the merge to the sync branch
        id: push
        if: steps.fetch.outputs.behind != '0' && steps.merge.outputs.problem == ''
        env:
          SYNC_BRANCH: ${{ steps.mode.outputs.sync_branch }}
        run: |
          for attempt in 1 2 3; do
            if git push --force origin "HEAD:refs/heads/${SYNC_BRANCH}" 2> "$RUNNER_TEMP/push.log"; then
              echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            cat "$RUNNER_TEMP/push.log"
            [ "$attempt" = 3 ] || sleep $((attempt * 10))
          done
          # GitHub refuses workflow file changes pushed with GITHUB_TOKEN, and
          # doesn't always say so (sometimes it answers "Internal Server Error").
          if grep -qi 'refusing to allow .* workflow' "$RUNNER_TEMP/push.log" \
             || [ -n "$(git diff --name-only "origin/${BASE_BRANCH}" HEAD -- .github/workflows)" ]; then
            echo "problem=workflows" >> "$GITHUB_OUTPUT"
          else
            echo "problem=push" >> "$GITHUB_OUTPUT"
          fi

      - name: Save the report
        if: always() && steps.merge.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: sync-report
          path: ${{ runner.temp }}/report
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop when the merge could not be pushed
        if: steps.merge.outputs.problem != '' || steps.push.outputs.problem != ''
        run: exit 1

  gui-checks:
    name: GUI checks
    needs: merge
    if: needs.merge.outputs.sha != ''
    permissions:
      contents: read
    uses: ./.github/workflows/macos-gui.yml
    with:
      ref: ${{ needs.merge.outputs.sha }}

  tests:
    name: Tests
    needs: merge
    if: needs.merge.outputs.sha != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.merge.outputs.sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.0.0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: uv sync --locked --group dev
      - run: make test-ci

  publish:
    name: Update default branch
    needs: [merge, gui-checks, tests]
    if: needs.merge.outputs.dry_run == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SHA: ${{ needs.merge.outputs.sha }}
      SYNC_BRANCH: ${{ needs.merge.outputs.sync_branch }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.merge.outputs.sha }}
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Fast-forward the default branch
        run: |
          # Never forced: if the branch moved during the run, the next run merges again.
          if ! git push origin "${SHA}:refs/heads/${BASE_BRANCH}"; then
            echo "::warning::${BASE_BRANCH} changed while the sync was running. The next run will merge again."
            exit 0
          fi
          git push origin --delete "$SYNC_BRANCH" || true
          echo "Updated \`${BASE_BRANCH}\` to \`${SHA}\`." >> "$GITHUB_STEP_SUMMARY"

  tags:
    name: Copy upstream release tags
    # Tags give installs from source the right version number. They are pushed
    # with GITHUB_TOKEN, even when SYNC_TOKEN is set, so that they don't start
    # release workflows.
    needs: [merge, publish]
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
    env:
      SHA: ${{ needs.merge.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.merge.outputs.sha }}
          fetch-depth: 0
      - name: Push new upstream release tags
        run: |
          git fetch --no-tags "https://github.com/${UPSTREAM_REPO}.git" "+refs/tags/v*:refs/tags/v*"
          mapfile -t missing < <(comm -23 \
            <(git tag --merged "$SHA" --list 'v*' | sort) \
            <(git ls-remote --tags --refs origin 'v*' | sed 's#.*refs/tags/##' | sort))
          if [ "${#missing[@]}" -gt 0 ]; then
            git push origin "${missing[@]/#/refs/tags/}"
          else
            echo "No new release tags."
          fi

  dry-run-cleanup:
    name: Remove dry-run branch
    needs: [merge, gui-checks, tests]
    if: always() && needs.merge.outputs.dry_run == 'true' && needs.merge.outputs.sha != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      SYNC_BRANCH: ${{ needs.merge.outputs.sync_branch }}
      RESULT: ${{ needs.gui-checks.result == 'success' && needs.tests.result == 'success' && 'passed' || 'failed' }}
    steps:
      - run: |
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${SYNC_BRANCH}" --silent || true
          echo "Dry run ${RESULT}; \`${BASE_BRANCH}\` was not updated." >> "$GITHUB_STEP_SUMMARY"

  report:
    name: Report problems
    needs: [merge, gui-checks, tests, publish]
    if: >-
      always() && needs.merge.result != 'skipped' && needs.merge.result != 'cancelled' &&
      (needs.merge.result == 'failure' || needs.gui-checks.result == 'failure' ||
       needs.tests.result == 'failure' || needs.publish.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}
      PROBLEM: ${{ needs.merge.outputs.problem }}
      DRY_RUN: ${{ needs.merge.outputs.dry_run }}
      SYNC_BRANCH: ${{ needs.merge.outputs.sync_branch }}
      CHECKS_FAILED: ${{ needs.gui-checks.result == 'failure' || needs.tests.result == 'failure' }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      ISSUE_TITLE: Upstream sync needs attention
    steps:
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: sync-report
          path: report

      - name: Describe the problem
        run: |
          repo_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          # shellcheck disable=SC2016 # the backticks are Markdown
          {
            case "$PROBLEM" in
              conflict)
                echo "Upstream changes conflict with this fork's changes, so nothing was merged. Conflicting files:"
                echo
                sed 's/^/- `/; s/$/`/' report/conflicts.txt 2> /dev/null
                echo
                echo "Resolve them on your computer; the next run continues from there:"
                echo
                echo '```bash'
                echo "git remote add upstream https://github.com/${UPSTREAM_REPO}.git  # once"
                echo "git fetch upstream"
                echo "git checkout ${BASE_BRANCH} && git merge upstream/${UPSTREAM_BRANCH}"
                echo "# fix the conflicts, then: git commit && git push"
                echo '```'
                ;;
              workflows)
                echo "Upstream changed files in \`.github/workflows/\`, which the built-in GITHUB_TOKEN may not push, so nothing was merged."
                echo
                echo "Either press **Sync fork → Update branch** on ${repo_url} to take these changes in, or add a \`SYNC_TOKEN\` secret (see the top of \`.github/workflows/sync-upstream.yml\`) so that such syncs go through automatically."
                ;;
              push)
                echo "The merge could not be pushed to \`${SYNC_BRANCH}\`. See the run log."
                ;;
              *)
                if [ "$CHECKS_FAILED" = "true" ]; then
                  echo "The merged code failed its checks, so \`${BASE_BRANCH}\` was not updated. The merge is on the \`${SYNC_BRANCH}\` branch: ${repo_url}/compare/${BASE_BRANCH}...${SYNC_BRANCH}"
                  echo
                  echo "Open the failed job in the run below to see what broke. If the GUI checks failed, upstream changed something the macOS app relies on: adapt the app (and \`macos/scripts/check_cli_contract.py\`) on \`${SYNC_BRANCH}\`. Later runs keep your commits there and merge once everything passes."
                else
                  echo "The sync failed. See the run log."
                fi
                ;;
            esac
            echo
            echo "Run: ${RUN_URL}"
            echo
            cat report/summary.md 2> /dev/null || true
          } > message.md
          cat message.md >> "$GITHUB_STEP_SUMMARY"

      - name: Open a pull request or issue
        if: env.DRY_RUN != 'true'
        run: |
          repo=(--repo "$GITHUB_REPOSITORY")
          if [ "$CHECKS_FAILED" = "true" ]; then
            number=$(gh pr list "${repo[@]}" --head "$SYNC_BRANCH" --state open --json number --jq '.[0].number // empty' 2> /dev/null || true)
            if [ -n "$number" ]; then
              gh pr comment "$number" "${repo[@]}" --body-file message.md && exit 0
            fi
            gh pr create "${repo[@]}" --head "$SYNC_BRANCH" --base "$BASE_BRANCH" \
              --title "Sync with ${UPSTREAM_REPO}: checks failed" --body-file message.md && exit 0
          fi
          number=$(gh issue list "${repo[@]}" --state open --search "\"${ISSUE_TITLE}\" in:title" --json number --jq '.[0].number // empty' 2> /dev/null || true)
          if [ -n "$number" ]; then
            gh issue comment "$number" "${repo[@]}" --body-file message.md && exit 0
          fi
          gh issue create "${repo[@]}" --title "$ISSUE_TITLE" --body-file message.md && exit 0
          echo "::notice::Couldn't open a pull request or issue in this repository; GitHub emails you about the failed run instead."
